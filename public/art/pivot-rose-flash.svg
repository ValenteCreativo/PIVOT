<svg width="260" height="230" viewBox="0 0 260 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rose and ribbon: good ideas go further">
  <!-- American Traditional flash: rose + banner. Placeholder asset; can be replaced by a hand-illustrated SVG at this same path. -->
  <defs>
    <style>
      .ink { fill: none; stroke: #151513; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .fill-red { fill: #8f2425; }
      .fill-red-d { fill: #6c1a1a; }
      .fill-leaf { fill: #244b3a; }
      .fill-paper { fill: #f3eadb; }
      .fill-gold { fill: #c9932d; }
      .band { font: 800 15px 'Barlow Condensed', Arial, sans-serif; letter-spacing: .04em; fill: #151513; }
    </style>
  </defs>

  <!-- leaves -->
  <path class="fill-leaf" d="M52 96c-22-6-40 2-46 20 20 6 40-1 50-16z"/>
